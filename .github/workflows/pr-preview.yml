name: Pull request preview

# Checks that a pull request builds, then asks deploy.yml (running on main) to
# redeploy the Pages site so the PR's live preview at
# https://zorenkonte.github.io/timer/pr-<number>/ is created, updated or, once
# the PR is closed, removed. deploy.yml posts the preview link on the PR.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build preview
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -- --base "/timer/pr-${{ github.event.pull_request.number }}/"

  request-deploy:
    name: Redeploy site with previews
    # Fork PRs are not previewed: their code would run with this repo's token.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deploy.yml on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
