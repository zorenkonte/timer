name: Preview link

# Cloudflare Workers Builds reports each preview as a check run whose summary
# holds the preview URLs, but it does not comment on the pull request. This
# workflow turns that check run into a sticky PR comment with the link, in the
# style of the Vercel bot, and refreshes it on every push.
#
# check_run events only trigger workflows from the default branch, so this
# starts working once it is on main.

on:
  check_run:
    types: [completed]

permissions:
  pull-requests: write

jobs:
  comment:
    if: startsWith(github.event.check_run.name, 'Workers Builds:') && github.event.check_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.check_run;
            const summary = run.output?.summary ?? '';
            const alias = summary.match(/Preview Alias URL:\s*(https?:\/\/\S+)/)?.[1];
            const version = summary.match(/Preview URL:\s*(https?:\/\/\S+)/)?.[1];
            const sha = run.head_sha.slice(0, 7);
            const marker = '<!-- cloudflare-preview -->';
            const ok = run.conclusion === 'success' && (alias || version);
            const when = new Date(run.completed_at).toUTCString();

            const body = ok
              ? [
                  marker,
                  '### ⚡ Cloudflare preview',
                  '',
                  `**${alias ?? version}**`,
                  '',
                  '| Status | Commit | Links | Updated |',
                  '| :--- | :--- | :--- | :--- |',
                  `| 🟢 Ready | ${sha} | [Preview](${alias ?? version})${version && alias ? ` · [This version](${version})` : ''} · [Build log](${run.details_url}) | ${when} |`,
                  '',
                  'Rebuilt on every push to this pull request.',
                ].join('\n')
              : [
                  marker,
                  '### ⚡ Cloudflare preview',
                  '',
                  `| Status | Commit | Links | Updated |`,
                  `| :--- | :--- | :--- | :--- |`,
                  `| 🔴 Build ${run.conclusion} | ${sha} | [Build log](${run.details_url}) | ${when} |`,
                  '',
                  'The preview keeps serving the last successful build, if any.',
                ].join('\n');

            for (const pr of run.pull_requests) {
              const { data: comments } = await github.rest.issues.listComments({
                ...context.repo, issue_number: pr.number, per_page: 100,
              });
              const existing = comments.find((c) => c.body?.startsWith(marker));
              if (existing) {
                await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
                core.info(`Updated preview comment on #${pr.number}`);
              } else {
                await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });
                core.info(`Posted preview comment on #${pr.number}`);
              }
            }
